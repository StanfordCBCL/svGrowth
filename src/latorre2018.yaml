# ==============================================================================
# SIMULATION CONFIGURATION
# ==============================================================================
simulation:
  simulation_name: "latorre2018"
  output_directory: "outputdir"
  n_days: 701.0
  dt: 0.5                      # days

  # Numerical methods
  integration_method: "trapezoidal"                  # For heredity integrals (trapezoidal, simpson)
  survival_function_computation: "backward"         # For survival function (naive, backward) # TODO: revised naming
  
  # Verbosity
  log_level: "info"

  # --------------------------------------------------------------------------
  # Equilibrium Solver (Geometric Equilibrium)
  # --------------------------------------------------------------------------
  equilibrium_solver:
    method: "brentq"           # Root-finding method (brentq, toms748, bisect)
    tolerance: 1e-5            # Tolerance for equilibrium residual

  # --------------------------------------------------------------------------
  # Fixed-Point Solver (Mass-Geometry Coupling)
  # --------------------------------------------------------------------------
  fixed_point_solver:
    tolerance: 1e-12           # Relative tolerance for mass density convergence
    max_iterations: 50         # Maximum fixed-point iterations

# ==============================================================================
# LAYERS
# ==============================================================================
layers:

  # ----------------------------------------------------------------------------
  # Layer 1: Cerebral Artery (Single-layer model)
  # Primary load-bearing arterial wall
  # ----------------------------------------------------------------------------
  - layer_name: "Cerebral artery"
    rhoR_h: 1050.0               # kg/m³ (homeostatic mass density) # TODO: remove, get from constituents

    # --------------------------------------------------------------------------
    # Homeostatic loading
    # --------------------------------------------------------------------------
    loading_variables:
      P_h: 14.18                 # kPa (homeostatic pressure)
      Q_h: 1.0                   # dimensionless or m³/day (homeostatic flow)
      blood_viscosity: 0.004     # Pa*s (for wss calculation)

    # --------------------------------------------------------------------------
    # Perturbations
    # --------------------------------------------------------------------------
    perturbations:
      pressure:
        type: "latorre2018"
        perturbation_time: 140.0
      
      flow_rate:
        type: "latorre2018"
        perturbation_time: 140.0

      axial_stretch:
        type: "latorre2018"
        perturbation_time: 140.0

    # --------------------------------------------------------------------------
    # Geometry
    # --------------------------------------------------------------------------
    geometry:
      type: "thin_wall_cylinder"
      a_h: 1.4                  # mm (homeostatic inner radius)
      h_h: 0.12                 # mm (homeostatic wall thickness)
      lambda_z_h: 1.0            # dimensionless (homeostatic axial stretch)
    
    # --------------------------------------------------------------------------
    # Constituents (Dictionary format - matches your code!)
    # --------------------------------------------------------------------------
    constituents:
      
      # ------------------------------------------------------------------------
      # ELASTIN
      # ------------------------------------------------------------------------
      elastin:
        mass_fraction: 0.02
        deposition_stretch: 1.40
        
        constitutive_model:
          type: "neo_hookean"
          parameters:
            c: 70.6              # kPa
      
      # ------------------------------------------------------------------------
      # SMOOTH MUSCLE CELLS
      # ------------------------------------------------------------------------
      smooth_muscle_cells:
        mass_fraction: 0.76
        deposition_stretch: 1.30
        
        constitutive_model:
          type: "fung_exponential"
          fiber_orientation: 90.0  # degrees (circumferential)
          parameters:
            c1: 10.0             # kPa
            c2: 3.5              # dimensionless
        
        active_properties:
          T_act_h: 170.0         # kPa (maximum active stress)
          k_act: 0.14285714285714285  # 1/day (activation rate)
          lambda_0: 0.4          # dimensionless (min stretch for activation)
          lambda_m: 1.1          # dimensionless (optimal stretch)
          CB: 0.8326             # dimensionless (basal calcium)
          CS: 0.4163
        
        kinetics:
          production:
            stimulus_function_form: "linear" #TODO: add sigmoidal
            gain_params:
              intramural_stress: 2.0
              wss: -1.0
          
          degradation:
            survival_function_form: "exponential"
            deg_rate:
              type: "quadratic"
              k_alpha_h: 0.07142857142857142  # 1/day (homeostatic degradation rate)
              gain_params:
                intramural_stress: 1.0
      
      # ------------------------------------------------------------------------
      # COLLAGEN - CIRCUMFERENTIAL FAMILY
      # ------------------------------------------------------------------------
      collagen_circumferential:
        mass_fraction: 0.22    
        deposition_stretch: 1.08
        
        constitutive_model:
          type: "fung_exponential"
          fiber_orientation: 90.0  # degrees (circumferential)
          parameters:
            c1: 672.5            # kPa
            c2: 22.0             # dimensionless
        
        kinetics:
          production:
            stimulus_function_form: "linear"
            gain_params:
              intramural_stress: 1.0
              wss: -0.5
          
          degradation:
            survival_function_form: "exponential"
            deg_rate:
              type: "quadratic"
              k_alpha_h: 0.1     # 1/day (homeostatic degradation rate)
              gain_params:
                intramural_stress: 1.0
                