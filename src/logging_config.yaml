  #   solver:
  #     level: DEBUG
  #     handlers: [console, file]
  #     propagate: false
    
  #   layer:
  #     level: INFO
  #     handlers: [console, file]
  #     propagate: false
    
  #   constituent:
  #     level: WARNING
  #     handlers: [console, file]
  #     propagate: false
    
  #   mechanics:
  #     level: WARNING
  #     handlers: [console, file]
  #     propagate: false
    
  #   kinetics:
  #     level: WARNING
  #     handlers: [console, file]
  #     propagate: false
    
  #   deformation_kinematics:
  #     level: INFO
  #     handlers: [console, file]
  #     propagate: false
    
  #   configuration:
  #     level: INFO
  #     handlers: [console, file]
  #     propagate: false
    
  #   simulation:
  #     level: INFO
  #     handlers: [console, file]
  #     propagate: false

  # =========================================================================
  # ROOT LOGGER - Global default settings
  # =========================================================================
  root:
    level: DEBUG                       # Global level (INFO = show INFO, WARNING, ERROR)
    handlers: [console, file]         # Send to both console and file