logging:
  version: 1
  disable_existing_loggers: false
  
  # =========================================================================
  # FORMATTERS - How log messages look
  # =========================================================================
  formatters:
    # Simple: Just the message (like print statements)
    simple:
      format: '%(message)s'
    
    # With module name: [module_name] message
    with_log_level:
      format: '[%(levelname)s] %(message)s'
    
    # Full details: [LEVEL] module_name: message
    detailed:
      format: '[%(levelname)s] %(name)s: %(message)s'
  
  # =========================================================================
  # HANDLERS - Where log messages go
  # =========================================================================
  handlers:
    # Console handler - prints to terminal
    console:
      class: logging.StreamHandler
      level: DEBUG                    # Minimum level for this handler
      formatter: with_log_level           
      stream: ext://sys.stdout        # Print to stdout
    
    # File handler - writes to file
    file:
      class: logging.FileHandler
      level: DEBUG                    # Log everything to file
      filename: simulation_debug.log  # Output file
      formatter: with_log_level       
      mode: w                         # 'w' = overwrite, 'a' = append

  # =========================================================================
  # MODULE LOGGER - Module default settings
  # =========================================================================
